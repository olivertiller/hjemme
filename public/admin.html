<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#f5f0eb" />
  <title>Hjemme — Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-dark: #f5f0eb;
      --bg-card: #ffffff;
      --text-primary: #2c2420;
      --text-muted: #8a7b6b;
      --accent-home: #5a8a3c;
      --accent-away: #c0623e;
      --radius: 20px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Nunito', sans-serif;
      background: var(--bg-dark);
      color: var(--text-primary);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .container {
      max-width: 380px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 40px;
      opacity: 0;
      animation: fade-in 0.5s ease 0.15s forwards;
    }
    @keyframes fade-in { to { opacity: 1; } }

    .header {
      text-align: center;
    }
    .header h1 {
      font-family: 'DM Serif Display', serif;
      font-size: 1.8rem;
      letter-spacing: -0.02em;
      margin-bottom: 6px;
    }
    .header p {
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    /* Auth section */
    .auth-section {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .auth-section label {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    .token-input {
      width: 100%;
      padding: 14px 18px;
      border-radius: 14px;
      border: 1px solid rgba(44, 36, 32, 0.12);
      background: var(--bg-card);
      color: var(--text-primary);
      font-family: 'Nunito', sans-serif;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.3s;
    }
    .token-input:focus {
      border-color: rgba(44, 36, 32, 0.3);
    }

    /* Toggle */
    .toggle-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    .status-label {
      font-family: 'DM Serif Display', serif;
      font-size: 1.5rem;
      transition: color 0.5s ease;
    }
    .status-label.home { color: var(--accent-home); }
    .status-label.away { color: var(--accent-away); }

    .toggle-track {
      width: 120px;
      height: 60px;
      border-radius: 30px;
      background: var(--bg-card);
      border: 2px solid rgba(44, 36, 32, 0.1);
      position: relative;
      cursor: pointer;
      transition: background 0.4s ease, border-color 0.4s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .toggle-track.home {
      background: rgba(90, 138, 60, 0.1);
      border-color: rgba(90, 138, 60, 0.25);
    }
    .toggle-track.away {
      background: rgba(192, 98, 62, 0.07);
      border-color: rgba(192, 98, 62, 0.15);
    }

    .toggle-thumb {
      position: absolute;
      top: 6px;
      left: 6px;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--accent-away);
      transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1), background 0.35s ease;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    }
    .toggle-thumb.home {
      transform: translateX(60px);
      background: var(--accent-home);
    }

    .toggle-labels {
      display: flex;
      justify-content: space-between;
      width: 120px;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-muted);
    }

    /* Feedback */
    .feedback {
      font-size: 0.85rem;
      color: var(--text-muted);
      text-align: center;
      min-height: 20px;
      transition: color 0.3s;
    }
    .feedback.error { color: #d97575; }
    .feedback.ok { color: var(--accent-home); }

    /* Disable state */
    .disabled {
      opacity: 0.35;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Hjemme-bryteren</h1>
      <p>Endre status som vennene dine ser.</p>
    </div>

    <div class="auth-section">
      <label for="token">Admin-token</label>
      <input
        class="token-input"
        id="token"
        type="password"
        placeholder="Lim inn admin-token …"
        autocomplete="off"
      />
    </div>

    <div class="toggle-area" id="toggleArea">
      <div class="status-label away" id="statusLabel">Ikke hjemme</div>

      <div class="toggle-track away" id="toggleTrack" role="switch" aria-checked="false" tabindex="0">
        <div class="toggle-thumb" id="toggleThumb"></div>
      </div>

      <div class="toggle-labels">
        <span>Ute</span>
        <span>Hjemme</span>
      </div>
    </div>

    <div class="feedback" id="feedback"></div>
  </div>

  <script>
    const $ = id => document.getElementById(id);
    let isHome = false;
    let busy = false;

    function renderToggle(home) {
      isHome = home;
      const cls = home ? 'home' : 'away';
      $('statusLabel').className = `status-label ${cls}`;
      $('statusLabel').textContent = home ? 'Hjemme' : 'Ikke hjemme';
      $('toggleTrack').className = `toggle-track ${cls}`;
      $('toggleTrack').setAttribute('aria-checked', String(home));
      $('toggleThumb').className = `toggle-thumb ${home ? 'home' : ''}`;
    }

    function showFeedback(msg, type = '') {
      const el = $('feedback');
      el.textContent = msg;
      el.className = `feedback ${type}`;
    }

    function getToken() {
      return $('token').value.trim();
    }

    // Load current status on open
    async function loadStatus() {
      try {
        const res = await fetch('/api/status');
        const data = await res.json();
        renderToggle(data.home);
      } catch (_) {
        showFeedback('Klarte ikke å hente status', 'error');
      }
    }

    async function toggleStatus() {
      const token = getToken();
      if (!token) {
        showFeedback('Skriv inn admin-token først', 'error');
        return;
      }
      if (busy) return;
      busy = true;

      const newHome = !isHome;
      renderToggle(newHome); // optimistic

      try {
        const res = await fetch('/api/status', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'X-Admin-Token': token,
          },
          body: JSON.stringify({ home: newHome }),
        });

        if (!res.ok) {
          const err = await res.json();
          renderToggle(!newHome); // revert
          showFeedback(err.error || 'Noe gikk galt', 'error');
        } else {
          const data = await res.json();
          renderToggle(data.home);
          showFeedback(data.home ? 'Venner kan nå se at du er hjemme!' : 'Status oppdatert — ikke hjemme.', 'ok');
        }
      } catch (_) {
        renderToggle(!newHome);
        showFeedback('Nettverksfeil — prøv igjen', 'error');
      }
      busy = false;
    }

    $('toggleTrack').addEventListener('click', toggleStatus);
    $('toggleTrack').addEventListener('keydown', e => {
      if (e.key === ' ' || e.key === 'Enter') {
        e.preventDefault();
        toggleStatus();
      }
    });

    // Save token to localStorage for convenience
    const savedToken = localStorage.getItem('hjemme_token');
    if (savedToken) $('token').value = savedToken;
    $('token').addEventListener('input', () => {
      localStorage.setItem('hjemme_token', $('token').value);
    });

    loadStatus();
  </script>
</body>
</html>
